<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--surface)}
.cv{position:relative;width:960px;height:288px;background:var(--surface);overflow:hidden}
.cv svg{position:absolute;left:0;top:0}
.ink{fill:var(--ink)}.red{fill:var(--red)}.alt{fill:var(--surface-alt)}.ln{fill:var(--line)}
.rule{stroke:var(--line);stroke-width:1}
.rule-red{stroke:var(--accent);stroke-width:1.5}
.nm{position:absolute;left:48px;bottom:48px;max-width:440px}
.nm h1{margin:0;font:400 76px/.95 var(--font-serif);letter-spacing:-.02em;color:var(--ink)}
.nm p{margin:12px 0 0;font:400 14px/1.4 var(--font-sans);color:var(--ink-muted)}
</style>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: ink 216x288 (space-24 x 2.25, full bleed) · red 120x168 · surface-alt 168x120 · line 96x48 (space-24 x space-12)
arrangement: one tall black slab bleeding off the top and bottom, with red and tint satellites stepping left, flush modular, square corners (radius-none)
pattern: editorial row, "Instrument Serif headlines, square blocks, borders not shadows": four hairline rules (line) crossing the blocks, one red hairline (accent)
scales: space-12 48, space-24 96, gaps space-6 24; radius-none
-->
<rect class="alt" x="504" y="24" width="168" height="120"/>
<rect class="red" x="600" y="120" width="120" height="168"/>
<rect class="ink" x="744" y="0" width="216" height="288"/>
<rect class="ln" x="528" y="216" width="96" height="48"/>
<line class="rule" x1="480" y1="72" x2="960" y2="72"/>
<line class="rule" x1="480" y1="168" x2="744" y2="168"/>
<line class="rule" x1="576" y1="0" x2="576" y2="288"/>
<line class="rule" x1="696" y1="0" x2="696" y2="288"/>
<line class="rule-red" x1="480" y1="240" x2="600" y2="240"/>
</svg>
<div class="nm"><h1>ScapeMedia</h1><p>Red, black and white. Red only where the eye must land.</p></div>
</div>
