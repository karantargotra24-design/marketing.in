.case.col .stages{grid-template-columns:1fr 1fr!important}.case .stage-t b{font-size:clamp(20px,2.2vw,30px)!important}
.pill.done{color:#3ddc84;border-color:#3ddc8455;background:#3ddc8414}
.cr .ph-cv,.upc .ph-cv{height:170px;padding:0;background:#111}
.ph-cv img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.72);transform:scale(1.04);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s}
.ph-cv:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,#0b0b0cdd),linear-gradient(120deg,#ff620033,transparent 55%);pointer-events:none}
.cr:hover .ph-cv img,.upc:hover .ph-cv img{transform:scale(1.12);filter:saturate(1.05) brightness(.85)}
.ph-cv span{z-index:2}
.ph-cv.soon img{filter:grayscale(.6) brightness(.55)}
.live-dot{position:absolute;z-index:2;top:12px;right:12px;font:600 11px var(--fh);font-style:normal;letter-spacing:.06em;color:#fff;background:#0b0b0caa;backdrop-filter:blur(6px);padding:5px 10px 5px 22px;border-radius:999px}
.live-dot:before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#ff3b30;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff3b30aa}70%{box-shadow:0 0 0 8px #ff3b3000}100%{box-shadow:0 0 0 0 #ff3b3000}}
.upc{gap:10px}.upc .ph-cv{border-radius:14px;overflow:hidden;position:relative;margin-bottom:4px}
.cmeta{display:flex;flex-wrap:wrap;gap:6px}.cmeta span{font:600 11px var(--fh);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.syl{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#ffffff05;transition:border-color .3s}
.syl[open]{border-color:#ff620066;padding-bottom:12px}
.syl summary{cursor:pointer;list-style:none;padding:12px 0;font:600 14px var(--fh);display:flex;justify-content:space-between;align-items:center}
.syl summary::-webkit-details-marker{display:none}
.syl summary i{width:10px;height:10px;border-right:2px solid var(--or);border-bottom:2px solid var(--or);transform:rotate(45deg);transition:transform .3s;margin-top:-4px}
.syl[open] summary i{transform:rotate(-135deg);margin-top:4px}
.syl h4{font:600 11px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--or);margin:8px 0 6px}
.syl ol,.syl ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--mute);display:grid;gap:6px}
.syl ol b{color:var(--tx);font-weight:600;margin-right:6px}
.syl[open] ol li,.syl[open] ul li{animation:slin .5s both}
.syl li:nth-child(2){animation-delay:.05s}.syl li:nth-child(3){animation-delay:.1s}.syl li:nth-child(4){animation-delay:.15s}.syl li:nth-child(5){animation-delay:.2s}.syl li:nth-child(6){animation-delay:.25s}.syl li:nth-child(7){animation-delay:.3s}.syl li:nth-child(8){animation-delay:.35s}
@keyframes slin{from{opacity:0;transform:translateX(-10px)}}
.cr .pr{margin-top:auto}
/* motion layer */
#sm-progress{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#ff6200,#ffb37a);z-index:9999;pointer-events:none}
#sm-cursor{position:fixed;top:0;left:0;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,#ff620022,transparent 65%);pointer-events:none;z-index:1;transition:opacity .4s;opacity:0}
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--sx,50%) var(--sy,50%),#ff62001f,transparent 45%);opacity:0;transition:opacity .4s;z-index:0}
.tilt:hover:before{opacity:1}
.cr.tilt{position:relative;overflow:hidden}
.sec.dk{background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:64px 64px;animation:gridmove 22s linear infinite}
@keyframes gridmove{to{background-position:64px 64px,64px 64px}}
.h2 em{background:linear-gradient(90deg,var(--or),#ffb37a,var(--or));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.btn-p{position:relative;overflow:hidden}
.btn-p:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff59,transparent);transform:skewX(-20deg);animation:sweep 3.8s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.wa-fab{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){#sm-cursor,#sm-progress{display:none}.sec.dk,.h2 em,.btn-p:after,.wa-fab,.live-dot:before,.syl li{animation:none!important}}
