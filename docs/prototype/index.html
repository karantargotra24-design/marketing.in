*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#banner{background:#fef3c7;color:#92400e;text-align:center;padding:6px 10px;font-weight:600;font-size:12px;position:sticky;top:0;z-index:30;border-bottom:1px solid #fcd34d}
.app{display:flex;min-height:calc(100vh - 30px)}
aside{width:236px;background:#0f172a;color:#cbd5e1;padding:14px 10px;flex-shrink:0;position:sticky;top:30px;height:calc(100vh - 30px);overflow:auto}
aside h1{font-size:15px;color:#fff;margin:2px 8px 12px}aside h1 small{display:block;color:#94a3b8;font-weight:400;font-size:11px}
aside .grp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin:14px 8px 4px}
aside a{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#cbd5e1;text-decoration:none;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
aside a:hover{background:#1e293b}aside a.on{background:var(--ac);color:#fff}
aside a i{font-style:normal;font-size:9px;border-radius:8px;padding:1px 6px;background:#334155;color:#cbd5e1}
aside a i.p{background:#854d0e;color:#fde68a}aside a i.n{background:#7f1d1d;color:#fecaca}aside a i.d{background:#14532d;color:#bbf7d0}
main{flex:1;min-width:0}
.top{display:flex;gap:8px;align-items:center;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:30px;z-index:20;flex-wrap:wrap}
.top select,.top input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;background:#fff}
.top input{flex:1;min-width:220px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.btn:hover{background:#f1f5f9}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.pri:hover{background:#4338ca}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad{background:#fff;color:var(--bad);border-color:#fecaca}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#screen{padding:18px;max-width:1280px}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 8px;font-size:15px}
.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g12{grid-template-columns:2fr 1fr}
@media(max-width:1000px){.g3,.g4,.g12,.g2{grid-template-columns:1fr 1fr}}
@media(max-width:760px){aside{display:none}.g2,.g3,.g4,.g12{grid-template-columns:1fr}#mnav{display:block!important}}
#mnav{display:none;margin:8px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;background:#e2e8f0;color:#334155;white-space:nowrap}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-ac{background:var(--ac2);color:#3730a3}.b-gr{background:#f1f5f9;color:#475569}.b-pu{background:#f3e8ff;color:#6b21a8}

table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}

.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}.col{background:#f1f5f9;border-radius:8px;padding:8px;min-height:120px}.col h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;color:var(--mut)}
.tk{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .d{background:#fff;border:1px solid var(--line);min-height:84px;padding:4px;border-radius:6px;font-size:11px}.cal .d b{color:var(--mut)}.cal .h{font-size:11px;color:var(--mut);text-align:center}

.src{display:inline-block;font-size:10px;background:#f1f5f9;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:#475569;margin-left:4px}
.wire{border:2px dashed #94a3b8;border-radius:8px;background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px);display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px}
.tl{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}.tl span.n{width:150px;flex-shrink:0}.tl .t{position:relative;flex:1;height:12px;background:#f1f5f9;border-radius:4px}.tl .t div{position:absolute;height:12px;border-radius:4px;background:var(--ac)}
.step{display:flex;gap:10px;margin-bottom:10px}.step .no{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.step.gate .no{background:var(--warn)}
.arch{display:grid;gap:8px}.layer{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.layer h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--ac)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:#f8fafc;font-size:12px}.chips span.live{background:#dcfce7;border-color:#86efac}.chips span.part{background:#fef3c7;border-color:#fcd34d}.chips span.no{background:#fee2e2;border-color:#fca5a5}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}.modal .card{max-width:760px;width:100%}
.legend span{margin-right:10px;font-size:12px}
.ph{color:var(--mut);font-style:italic}

/* ===== router & interactions ===== */
function planFor(text){
  const t=text.toLowerCase();
  const full=[["research","Research & Market Intelligence","Competitor + market gaps (no web tool yet: gap report)",[]],["audit_strategy","Business Audit & Strategy","Audit + risk flags",[]],["seo_web","SEO & Website","Website/GBP review",[]],["social","Social Media Strategist","Handles & platform plan",[]]];
  const content=[["content","Content Strategist","Calendar, hooks, captions",["research","audit_strategy"]],["video","Video & Reels","Reel scripts + storyboards",["content"]],["creative","Creative Director","Briefs + image/video prompts",["content"]]];
  const tail=[["qa","Quality Assurance","Claims · numbers · voice · isolation",["…all above"]],["approval","YOU — Approval Centre","Approve / request changes / reject",["qa"]]];
  let p=[];
  if(/audit|research|review|analy/.test(t)&&!/content|calendar|post|reel/.test(t))p=[...full,...tail];
  else if(/content|calendar|post|reel|caption|script/.test(t))p=[...full.slice(0,2),...content,...tail];
  else p=[...full,...content,...tail];
  return p;
}
function openPlan(text){
  const p=planFor(text);
  $("#modal").innerHTML=`<div class="modal"><div class="card"><div class="row sp"><h3>Orchestrator plan preview ${SMP}</h3><button class="btn" data-act="close">✕</button></div>
  <p><b>Client:</b> ${C().name} · <b>Instruction:</b> “${text}”</p>
  <p class="ph">SIMULATED PREVIEW of the plan screen. In the real app the Orchestrator builds this from fixed workflow templates today (audit_360, full_review, content_plan, onboarding); free-text planning is not built.</p>
  <table><tr><th>#</th><th>Agent</th><th>Task</th><th>Waits for</th><th>Progress (simulated)</th></tr>${p.map((x,i)=>`<tr><td>${i+1}</td><td>${x[1]}</td><td>${x[2]}</td><td class="ph">${x[3].join(", ")||"— starts now"}</td><td style="width:140px"><div class="bar"><div id="pb${i}" style="width:0"></div></div></td></tr>`).join("")}</table>
  <p>Estimated AI cost: <b>${bd("mock — $0","b-warn")}</b> <span class="ph">(live ≈ ₹15–40 per 7-agent run at proposed models)</span></p>
  <div class="row"><button class="btn pri" data-act="simrun" data-v="${p.length}">Approve plan & run (simulated)</button><button class="btn" data-act="close">Cancel</button></div></div></div>`;
}
function simRun(n){
  const run=(i,delay)=>setTimeout(()=>{const el=document.getElementById("pb"+i);if(el)el.style.cssText="width:100%;transition:width .6s"},delay);
  const parallel=Math.max(n-3,1);
  for(let i=0;i<parallel;i++)run(i,150+i*40);       // independent agents start together
  for(let i=parallel;i<n;i++)run(i,900+(i-parallel)*500); // dependent steps follow
}
function nav(){
  let h=`<h1>Marketing OS<small>AI marketing agency</small></h1>`,last="";
  for(const [k,l,g,s] of SCREENS){ if(g!==last){h+=`<div class="grp">${GROUPS[g]}</div>`;last=g}
    const t=TODAY[k][0];h+=`<a data-act="go" data-v="${k}" class="${st.screen===k?'on':''}">${l}<i class="${t==="Not built"?"n":t==="Partial"?"p":"d"}">${t==="Not built"?"design":t==="Partial"?"partial":"info"}</i></a>`}
  $("#nav").innerHTML=h;
  $("#mnav").innerHTML=SCREENS.map(([k,l])=>`<option value="${k}" ${k===st.screen?"selected":""}>${l}</option>`).join("");
}
function render(){nav();$("#screen").innerHTML=S[st.screen]();location.hash=st.screen+"/"+st.client;window.scrollTo(0,0)}
function toast(m){$("#modal").innerHTML=`<div class="modal" data-act="close"><div class="card"><b>Prototype</b><p>${m}</p><button class="btn pri" data-act="close">OK</button></div></div>`}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,v=el.dataset.v,k=el.dataset.k;
  if(a==="go"){if(el.dataset.c){st.client=el.dataset.c;$("#client").value=st.client}st.screen=v;render()}
  else if(a==="tab"){st.tab[k]=v;const y=scrollY;$("#screen").innerHTML=S[st.screen]();scrollTo(0,y)}
  else if(a==="sel"){st.sel[k]=isNaN(v)?v:Number(v);const y=scrollY;$("#screen").innerHTML=S[st.screen]();scrollTo(0,y)}
  else if(a==="postok"){st.post[v]="approved";$("#screen").innerHTML=S[st.screen]()}
  else if(a==="postchg"){st.post[v]="changes";$("#screen").innerHTML=S[st.screen]()}
  else if(a==="decide"){const id=st.sel.appr??1;st.appr[id]=v==="changes"?"changes requested":v;$("#screen").innerHTML=S[st.screen]()}
  else if(a==="tog"){st.tog[v]=!st.tog[v];$("#screen").innerHTML=S[st.screen]()}
  else if(a==="toast"){toast(v)}
  else if(a==="plan"){openPlan(v)}
  else if(a==="simrun"){simRun(Number(v));el.disabled=true;el.textContent="Running (simulated)…"}
  else if(a==="close"){if(e.target.closest(".card")&&el.classList.contains("modal")&&e.target.closest(".card"))return;$("#modal").innerHTML=""}
});
$("#client").innerHTML=Object.entries(CLIENTS).map(([k,c])=>`<option value="${k}">${c.name}</option>`).join("");
$("#client").onchange=e=>{st.client=e.target.value;st.sel={};render()};
$("#mnav").onchange=e=>{st.screen=e.target.value;render()};
$("#send").onclick=()=>{const t=$("#ask").value.trim();if(!t){toast("Type an instruction first, e.g. “Build next week's content plan”.");return}openPlan(t)};
$("#ask").onkeydown=e=>{if(e.key==="Enter")$("#send").click()};
(function init(){const [s,c]=location.hash.slice(1).split("/");if(S[s])st.screen=s;if(CLIENTS[c]){st.client=c;$("#client").value=c}render()})();
</script></body></html>
